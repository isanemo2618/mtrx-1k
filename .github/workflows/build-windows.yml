name: Build Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Inspect Repository Structure
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Depth 2 | Select-Object FullName

      - name: Configure CMake (Auto-locate CMakeLists.txt)
        shell: pwsh
        run: |
          $cmakeFile = Get-ChildItem -Recurse -Filter "CMakeLists.txt" | Where-Object { $_.FullName -notmatch "JUCE|build|third_party|libs" } | Select-Object -First 1
          if ($cmakeFile) {
            $srcDir = $cmakeFile.DirectoryName
            Write-Host "Found CMakeLists.txt at: $srcDir"
            cmake -S "$srcDir" -B build -G "Visual Studio 17 2022" -A x64
          } else {
            Write-Error "No CMakeLists.txt found in repository! Check Inspect Repository Structure output."
            exit 1
          }

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: MTRX-1K-Windows
          path: build/**/Release/*
